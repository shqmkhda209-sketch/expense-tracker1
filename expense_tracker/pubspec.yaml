name: expense_tracker
description: اپلیکیشن آفلاین مدیریت درآمد و هزینه شخصی
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # مدیریت وضعیت
  provider: ^6.1.2

  # پایگاه داده محلی (بدون نیاز به build_runner)
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.4

  # ذخیره‌سازی ساده تنظیمات (تم، واحد پول)
  shared_preferences: ^2.2.3

  # نمودارها
  fl_chart: ^0.68.0

  # اعلان‌های محلی (یادآوری روزانه)
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

  # انتخاب فایل برای بازیابی نسخه پشتیبان
  file_picker: ^8.1.2

  # فرمت اعداد و تاریخ فارسی
  intl: ^0.19.0
  shamsi_date: ^1.1.1

  # آیکون‌ها
  cupertino_icons: ^1.0.8

  # اشتراک‌گذاری فایل بکاپ
  share_plus: ^10.0.2

  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/

  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Light.ttf
          weight: 300
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
